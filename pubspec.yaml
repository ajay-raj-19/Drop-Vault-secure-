name: drop_vault
description: Drop Vault Flutter application.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  crypto: ^3.0.7
  file_picker: ^8.1.7
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  image_picker: ^1.2.2
  open_filex: any
  path_provider: ^2.1.4
  pdf: ^3.11.1
  share_plus: ^10.0.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  supabase_flutter: ^2.6.0
  flutter_dotenv: ^5.1.0
  google_sign_in: ^6.2.1
  uuid: ^4.3.3
  window_manager: ^0.4.3
  desktop_drop: ^0.5.0
  launch_at_startup: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

